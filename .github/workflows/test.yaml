name: "Tests"
run-name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions: # https://github.com/dorny/test-reporter/issues/168
      statuses: write
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # a test binary only compiles the packages its own tests reach, so this is
      # what catches a package no test imports yet
      - name: Build
        run: go build ./...

      # https://golangci-lint.run/
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

      - name: Setup gotestsum
        run: go install gotest.tools/gotestsum@latest

      # Every test here drives real certificates through the real filesystem, so
      # the whole suite is integration tests and there is no faster unit subset
      # to split out. -race is the step neither consumer repo runs: this code
      # guards a package-level pool with a mutex, and it is a library, so a race
      # introduced here surfaces in two binaries rather than one.
      - name: Integration Tests
        run: gotestsum --format testname --junitfile results/integration-tests.xml -- -race -count=1 ./...

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: Test Results
          path: "results/*-tests.xml"
          reporter: java-junit
